# H-Board's server on your own machine: `docker compose up -d --build`. The library is kept in the
# `h-board-data` volume. Copy .env.example to .env to change the port or trust a proxy. The guide,
# with the setup code, TLS and backup, is docs/server.md.
services:
  h-board:
    build:
      context: .
      dockerfile: packages/host-server/Dockerfile
    restart: unless-stopped
    environment:
      HBOARD_TRUST_PROXY: ${HBOARD_TRUST_PROXY:-0}
    ports:
      - "127.0.0.1:${HBOARD_PORT:-8787}:8787"
    volumes:
      - h-board-data:/data
    read_only: true
    # SQLite's temporary files, for large sorts; the rest of the file system is read only.
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  h-board-data:
