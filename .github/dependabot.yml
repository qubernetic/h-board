# Every entry targets develop: the default branch becomes main after the first release, and
# without target-branch Dependabot would open its pull requests there.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    versioning-strategy: increase
    ignore:
      # @codecov/vite-plugin 2.0.1 supports Vite up to 6
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
      # typescript-eslint 8 supports TypeScript below 6.1
      - dependency-name: typescript
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(ci)

  - package-ecosystem: docker
    directory: /packages/host-server
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(docker)
