# Asset files pinned by sha256, checked by `scripts/check-assets.mjs` (`just assets`, part of `just ci`).
#
# A `[[source]]` names where files come from. A `[[file]]` gives the `path` in this repository, its `source` (an
# `id` below), the path it has there (`from`) and its `sha256`. A file with the source `qubernetic-brand` is a byte
# copy of the brand repository's file at that tag; one with the source `simple-icons` is a byte copy of Simple Icons'
# file at that version. A file with the source `rendered` was made here, from the brand's micro mark or as a list or
# a notice (see its row in ATTRIBUTION.md); the pin keeps it from changing unnoticed.
#
# `roots` lists the folders this file governs in full: every file under one of them needs a `[[file]]`.
# A missing file, a changed file or an unlisted file under a root fails the check. Whose each file is and under
# which licence stays in ATTRIBUTION.md.

roots = ["extension/icons", "mock/img", "packages/host-extension/public/icons", "packages/ui/assets"]

